name: integration

on:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      XORPAY_APP_ID: ${{ secrets.XORPAY_APP_ID }}
      XORPAY_APP_SECRET: ${{ secrets.XORPAY_APP_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Build examples
        run: go build ./examples/...

      - name: Run smoke integration (pay demo)
        if: ${{ env.XORPAY_APP_ID != '' && env.XORPAY_APP_SECRET != '' }}
        run: go run ./examples/pay_native
